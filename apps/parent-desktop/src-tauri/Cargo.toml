[package]
name = "ocentra-parent-desktop"
version = "0.1.1"
description = "Ocentra Parent desktop portal shell"
edition = "2021"
license = "UNLICENSED"

[lib]
name = "ocentra_parent_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ocentra-parent-agent-protocol = { path = "../../../crates/agent-protocol" }
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2", features = [] }

[lints.rust]
unsafe_code = "forbid"

[workspace]
