      <stop offset=".52" stop-color="#0e314b" stop-opacity=".48"/>
      <stop offset="1" stop-color="#071827" stop-opacity=".68"/>
    </linearGradient>
    <linearGradient id="tabCountGoldFill" x1="0" y1="0" x2="0" y2="1">
