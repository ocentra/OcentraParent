<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1505 532" preserveAspectRatio="none">
  <defs>
    <linearGradient id="skeletonGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3b52" stop-opacity=".34"/>
      <stop offset=".52" stop-color="#02080d" stop-opacity=".58"/>
      <stop offset="1" stop-color="#0c1835" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="navIdle" x1="0" y1="0" x2="0" y2="1">
