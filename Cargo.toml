[workspace]
resolver = "2"
members = [
  "crates/app-core",
  "crates/app-game-core",
  "crates/billing-core",
  "crates/agent-core",
  "crates/agent-protocol",
  "crates/agent-service",
  "crates/logging-core",
  "crates/agent-updater",
  "crates/browser-core",
  "crates/child-ai-core",
  "crates/child-enforcement-core",
  "crates/child-notification-core",
  "crates/child-policy-core",
  "crates/child-runtime",
  "crates/child-runtime-android-bridge",
  "crates/entitlement-core",
  "crates/family-identity-core",
  "crates/lan-core",
  "crates/network-core",
  "crates/ocentra-evidence",
  "crates/ocentra-eventing",
  "crates/ocentra-network-evidence",
  "crates/parent-runtime-core",
  "crates/policy-control-core",
  "crates/provisioning-core",
  "crates/protected-capability-custody-core",
  "crates/remote-access-core",
  "crates/screen-capture-adapter",
  "crates/screen-ai-core",
  "crates/screen-core",
  "crates/screen-live-view-core",
  "crates/schema",
  "crates/storage-custody-core",
  "crates/tracking-core"
]

# The current crates.io releases of xcb and wayland-scanner still select
# vulnerable quick-xml ranges. Their upstream heads have moved to 0.41 while
# retaining compatible package versions; pin those fixes until releases land.
[patch.crates-io]
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb.git", rev = "8f1a726abc8cb9f62169d0032a94e268fc3379af" }
wayland-scanner = { git = "https://github.com/Smithay/wayland-rs.git", rev = "249f35c8ce18c8a8000c627ffe04ac235bc0764f" }

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "UNLICENSED"

# Protected-capability custody package registration is intentionally staged.
# These packages remain planned until real manifests and non-placeholder
# targets land in the implementation packet; they must not be activated as
# workspace members by a docs-only route.
[workspace.metadata.ocentra-protected-capability-custody]
planned_members = [
  "crates/protected-capability-custody-protocol",
  "crates/protected-capability-custody-broker",
  "crates/protected-capability-custody-client",
]
activation_rule = "Activate only with real Cargo.toml plus lib/main targets and focused package validation."

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
future_not_send = "deny"
large_futures = "deny"
arc_with_non_send_sync = "deny"
clone_on_ref_ptr = "deny"
redundant_clone = "deny"
needless_pass_by_value = "deny"
needless_pass_by_ref_mut = "deny"
map_err_ignore = "deny"
large_enum_variant = "deny"
large_stack_arrays = "deny"
large_stack_frames = "deny"
