[workspace]
resolver = "2"
members = [
  "crates/app-core",
  "crates/app-game-core",
  "crates/billing-core",
  "crates/agent-core",
  "crates/agent-protocol",
  "crates/agent-service",
  "crates/logging-core",
  "crates/agent-updater",
  "crates/browser-core",
  "crates/child-ai-core",
  "crates/child-enforcement-core",
  "crates/child-notification-core",
  "crates/child-policy-core",
  "crates/child-runtime",
  "crates/entitlement-core",
  "crates/family-identity-core",
  "crates/lan-core",
  "crates/network-core",
  "crates/ocentra-evidence",
  "crates/ocentra-eventing",
  "crates/ocentra-network-evidence",
  "crates/parent-runtime-core",
  "crates/policy-control-core",
  "crates/provisioning-core",
  "crates/remote-access-core",
  "crates/screen-capture-adapter",
  "crates/screen-ai-core",
  "crates/screen-core",
  "crates/screen-live-view-core",
  "crates/storage-custody-core",
  "crates/tracking-core"
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
future_not_send = "deny"
large_futures = "deny"
arc_with_non_send_sync = "deny"
clone_on_ref_ptr = "deny"
redundant_clone = "deny"
needless_pass_by_value = "deny"
needless_pass_by_ref_mut = "deny"
map_err_ignore = "deny"
large_enum_variant = "deny"
large_stack_arrays = "deny"
large_stack_frames = "deny"
