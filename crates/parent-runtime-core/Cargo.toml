[package]
name = "ocentra-parent-runtime-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
getrandom = "0.3.4"
ocentra-child-runtime = { path = "../child-runtime" }
ocentra-eventing = { path = "../ocentra-eventing" }
ocentra-family-identity-core = { path = "../family-identity-core" }
ocentra-parent-agent-protocol = { path = "../agent-protocol" }
ocentra-policy-control-core = { path = "../policy-control-core" }
ocentra-protected-capability-custody-client = { path = "../protected-capability-custody-client" }
ocentra-schema = { path = "../schema" }
ocentra-storage-custody-core = { path = "../storage-custody-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tungstenite = "0.24.0"
zeroize = "1.8.2"

[dev-dependencies]
ocentra-lan-core = { path = "../lan-core" }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
