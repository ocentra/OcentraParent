[package]
name = "ocentra-lan-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
ed25519-dalek = "2.2.0"
ocentra-eventing = { path = "../ocentra-eventing" }
ocentra-parent-agent-protocol = { path = "../agent-protocol" }
rustls = "0.23.41"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
socket2 = { version = "0.6.4", features = ["all"] }
thiserror = "2.0.18"
x509-parser = "0.18.1"

[dev-dependencies]
rcgen = "0.14.8"

[[test]]
name = "performance"
path = "tests/performance/main.rs"

[[test]]
name = "unit"
path = "tests/unit/main.rs"
