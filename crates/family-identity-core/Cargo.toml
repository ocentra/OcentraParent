[package]
name = "ocentra-family-identity-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
atomicwrites = "0.4.4"
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
ed25519-dalek = "2.2.0"
fs2 = "0.4.3"
getrandom = "0.3.4"
num-bigint = "0.4.6"
ring = "0.17.14"
ocentra-eventing = { path = "../ocentra-eventing" }
ocentra-schema = { path = "../schema" }
rusqlite = { version = "0.39.0", features = ["bundled"] }
same-file = "1.0.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[dev-dependencies]
ocentra-storage-custody-core = { path = "../storage-custody-core" }

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "contract"
path = "tests/contract/mod.rs"
