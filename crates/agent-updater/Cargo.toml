[package]
name = "ocentra-parent-agent-maintenance"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
ocentra-schema = { path = "../schema" }
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["fs", "macros", "process", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3.23.0"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "contract"
path = "tests/contract/mod.rs"

[[bin]]
name = "ocentra-parent-agent-updater"
path = "src/bin/updater.rs"
test = false

[[bin]]
name = "ocentra-parent-agent-tool"
path = "src/bin/tool.rs"
test = false
