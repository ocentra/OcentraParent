[package]
name = "ocentra-policy-control-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
ed25519-dalek = "2.2.0"
ocentra-family-identity-core = { path = "../family-identity-core" }
ocentra-evidence = { path = "../ocentra-evidence" }
ocentra-eventing = { path = "../ocentra-eventing" }
ocentra-schema = { path = "../schema" }
ocentra-parent-agent-protocol = { path = "../agent-protocol" }
sha2 = "0.10.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt", "macros"] }

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[[test]]
name = "version-skew"
path = "tests/version-skew/main.rs"
