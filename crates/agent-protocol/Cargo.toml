[package]
name = "ocentra-parent-agent-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
test-support = []

[[test]]
name = "contract"
path = "tests/contract/main.rs"

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[dependencies]
ocentra-ai-contracts = { path = "../ai-contracts" }
ocentra-evidence = { path = "../ocentra-evidence" }
ocentra-eventing = { path = "../ocentra-eventing" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
ocentra-network-evidence = { path = "../ocentra-network-evidence" }
tokio = { version = "1.48.0", features = ["macros", "rt"] }
