[package]
name = "ocentra-parent-logging-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
getrandom = "0.3.4"
ocentra-schema = { path = "../schema" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "contract"
path = "tests/contract/mod.rs"

[[test]]
name = "observability"
path = "tests/observability/mod.rs"

[[test]]
name = "bridge_log_runtime"
path = "tests/bridge_log_runtime/mod.rs"

[[test]]
name = "parent_log_runtime"
path = "tests/parent_log_runtime/mod.rs"

[[test]]
name = "stack_trace_runtime"
path = "tests/stack_trace_runtime/mod.rs"

[[test]]
name = "ndjson_operation_compaction_cache"
path = "tests/ndjson_operation_compaction_cache.rs"
required-features = ["test-support"]
