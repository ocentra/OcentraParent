[package]
name = "ocentra-parent-logging-local-artifact-windows-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
fs2 = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[target.'cfg(windows)'.dev-dependencies]
interprocess = "2.4.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
      "Win32_Storage_FileSystem",
      "Win32_Security",
      "Win32_System_Pipes",
      "Win32_System_Threading",
] }

[[test]]
name = "local_artifact_windows"
path = "tests/integration/local_artifact_windows.rs"
