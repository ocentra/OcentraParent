[package]
name = "ocentra-app-game-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
atomicwrites = "0.4.4"
fs2 = "0.4.3"
ocentra-eventing = { path = "../ocentra-eventing" }
ocentra-parent-agent-protocol = { path = "../agent-protocol" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt"] }

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "contract"
path = "tests/contract/mod.rs"
