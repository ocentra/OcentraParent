[package]
name = "ocentra-entitlement-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
atomicwrites = "0.4.4"
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
ed25519-dalek = "2.2.0"
fs2 = "0.4.3"
ocentra-family-identity-core = { path = "../family-identity-core" }
ocentra-eventing = { path = "../ocentra-eventing" }
ocentra-schema = { path = "../schema" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "contract"
path = "tests/contract/mod.rs"
