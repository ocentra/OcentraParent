[package]
name = "ocentra-parent-agent-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "=0.8.7", features = ["ws"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
ocentra-parent-agent-core = { path = "../agent-core" }
ocentra-parent-agent-protocol = { path = "../agent-protocol" }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6.7", features = ["cors"] }
