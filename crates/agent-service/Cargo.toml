[package]
name = "ocentra-parent-agent-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
axum = { version = "=0.8.7", features = ["ws"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
base64 = "0.22.1"
ocentra-parent-agent-core = { path = "../agent-core" }
ocentra-parent-agent-protocol = { path = "../agent-protocol" }
ocentra-child-runtime = { path = "../child-runtime" }
ocentra-eventing = { path = "../ocentra-eventing" }
ocentra-parent-runtime-core = { path = "../parent-runtime-core" }
ocentra-parent-screen-capture-adapter = { path = "../screen-capture-adapter" }
ocentra-network-evidence = { path = "../ocentra-network-evidence" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6.7", features = ["cors"] }
