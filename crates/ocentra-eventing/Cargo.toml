[package]
name = "ocentra-eventing"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde", "std"] }
futures = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }

[[test]]
name = "contract"
path = "tests/contract/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[[test]]
name = "journal_replay"
path = "tests/journal_replay/mod.rs"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "version_skew"
path = "tests/version-skew/mod.rs"
