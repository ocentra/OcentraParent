[package]
name = "ocentra-parent-agent-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
atomicwrites = "0.4.4"
chacha20poly1305 = "0.10.1"
chrono = "0.4.44"
ed25519-dalek = "2.2.0"
fs2 = "0.4.3"
ocentra-eventing = { path = "../ocentra-eventing" }
ocentra-network-evidence = { path = "../ocentra-network-evidence" }
ocentra-parent-agent-protocol = { path = "../agent-protocol" }
ocentra-tracking-core = { path = "../tracking-core" }
rusqlite = { version = "0.39.0", features = ["bundled"] }
roxmltree = "0.20.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
active-win-pos-rs = "0.10.1"
winreg = "0.56.0"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "unit"
path = "tests/unit/main.rs"
