ocentra-parent-agent-protocol = { path = "../agent-protocol" }
ocentra-screen-core = { path = "../screen-core" }
ocentra-screen-live-view-core = { path = "../screen-live-view-core" }
ocentra-tracking-core = { path = "../tracking-core" }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
