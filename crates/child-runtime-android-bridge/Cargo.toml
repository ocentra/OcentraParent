[package]
name = "ocentra-child-runtime-android-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ocentra_child_runtime_android"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[lints.rust]
# Rust 2024 requires exported JNI symbols to use `#[unsafe(no_mangle)]`.
# This exception is confined to this native boundary; unsafe functions and
# operations remain denied below, and the crate contains no unsafe blocks.
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
future_not_send = "deny"
large_futures = "deny"
arc_with_non_send_sync = "deny"
clone_on_ref_ptr = "deny"
redundant_clone = "deny"
needless_pass_by_value = "deny"
needless_pass_by_ref_mut = "deny"
map_err_ignore = "deny"
large_enum_variant = "deny"
large_stack_arrays = "deny"
large_stack_frames = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
jni = "0.21.1"
ocentra-child-runtime = { path = "../child-runtime" }
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.23.0"

[[test]]
name = "integration_bridge_lifecycle"
path = "tests/integration/bridge_lifecycle.rs"
