[package]
name = "ocentra-account-issuer-owner"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
ocentra-family-identity-core = { path = "../family-identity-core" }
ocentra-protected-capability-custody-core = { path = "../protected-capability-custody-core" }
ocentra-protected-capability-custody-protocol = { path = "../protected-capability-custody-protocol" }
ocentra-schema = { path = "../schema" }
ring = "0.17.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[[test]]
name = "unit"
path = "tests/unit/delivery_boundaries.rs"
