name = "ocentra-parent-cloudflare"
main = "src/index.ts"
compatibility_date = "2026-06-14"
workers_dev = false

[vars]
ENVIRONMENT = "production"
APP_ORIGIN = "https://parent.ocentra.com"
CORS_ALLOWED_ORIGINS = "https://parent.ocentra.com"
REQUEST_MAX_BYTES = "1048576"
BILLING_ROUTE_KILL_SWITCH = "false"
AUTH_ADAPTER_MODE = "account-auth-adapter-manual-required"
ENTITLEMENT_SIGNING_KEY_REF = "manual-required-production-ref"

[[d1_databases]]
binding = "BILLING_D1"
database_name = "ocentra-parent-billing"
database_id = "REPLACE_WITH_PRODUCTION_D1_ID"

[[d1_databases]]
binding = "ACCOUNT_IDENTITY_D1"
database_name = "ocentra-parent-account-identity"
database_id = "REPLACE_WITH_PRODUCTION_ACCOUNT_IDENTITY_D1_ID"

[[kv_namespaces]]
binding = "BILLING_RATE_LIMIT_KV"
id = "REPLACE_WITH_PRODUCTION_RATE_LIMIT_KV_ID"

[[kv_namespaces]]
binding = "BILLING_CONFIG_KV"
id = "REPLACE_WITH_PRODUCTION_CONFIG_KV_ID"

[[queues.producers]]
binding = "BILLING_RECONCILIATION_QUEUE"
queue = "ocentra-parent-billing-reconciliation"

[[queues.producers]]
binding = "BILLING_DEAD_LETTER_QUEUE"
queue = "ocentra-parent-billing-dead-letter"

[[r2_buckets]]
binding = "BILLING_AUDIT_R2"
bucket_name = "ocentra-parent-billing-audit"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "ocentra_parent_cloudflare_production"

[[durable_objects.bindings]]
name = "BILLING_DO"
class_name = "BillingControlDO"

[[durable_objects.bindings]]
name = "REFERRAL_DO"
class_name = "ReferralControlDO"

[[durable_objects.bindings]]
name = "ENTITLEMENT_SNAPSHOT_DO"
class_name = "EntitlementSnapshotDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BillingControlDO", "ReferralControlDO", "EntitlementSnapshotDO"]
