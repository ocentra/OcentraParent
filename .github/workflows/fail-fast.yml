name: Fail Fast

on:
  workflow_call:
    inputs:
      docs_hub_only:
        description: Run the lightweight docs/hub-only gate instead of full source validation.
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-fast:
    name: Format, Lint, Types, Rust Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci
        if: ${{ !inputs.docs_hub_only }}

      - uses: ./.github/actions/setup-ci
        if: ${{ inputs.docs_hub_only }}
        with:
          install-rust: 'false'

      - name: Docs/hub-only format check
        if: ${{ inputs.docs_hub_only }}
        run: npx prettier --check docs .hub *.md

      - name: Docs/hub-only lane guard
        if: ${{ inputs.docs_hub_only }}
        run: npm run lanes:guard

      - name: Docs/hub-only hub guard
        if: ${{ inputs.docs_hub_only }}
        run: npm run hub:guard

      - name: Format check
        if: ${{ !inputs.docs_hub_only }}
        run: npm run format:check

      - name: Release version policy
        if: ${{ !inputs.docs_hub_only }}
        run: npm run release:version

      - name: Lint
        if: ${{ !inputs.docs_hub_only }}
        run: npm run lint

      - name: Type check
        if: ${{ !inputs.docs_hub_only }}
        run: npm run type-check

      - name: Rust check
        if: ${{ !inputs.docs_hub_only }}
        run: cargo check --workspace
