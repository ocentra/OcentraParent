name: Validate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Full Validation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate
        run: npm run validate
