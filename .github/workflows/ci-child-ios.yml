name: CI Child iOS

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  child-ios-contract-build:
    name: 'Contract: Child iOS Shared Contract Build'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci
        with:
          install-tauri-system-dependencies: 'false'

      - name: Build shared contracts
        run: npm run build:contracts

  child-ios-entitlement-proof:
    name: 'Proof: Child iOS Entitlement Capability'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [child-ios-contract-build]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci
        with:
          install-tauri-system-dependencies: 'false'

      - name: Build shared contracts
        run: npm run build:contracts

      - name: iOS entitlement capability contracts
        run: npm run test:child-ios-entitlement-capability-proof
