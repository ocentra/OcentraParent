name: CI Child iOS

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  child-ios:
    name: Child iOS Runtime and Proofs
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci

      - name: iOS entitlement capability proof
        run: npm run test:child-ios-entitlement-capability-proof

      - name: Tracking iOS simulator proof
        run: npm run test:tracking-plan-ios-simulator-proof
