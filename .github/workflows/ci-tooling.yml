name: CI Tooling

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    name: 'Test: Repo Tooling Scripts'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci
        with:
          install-rust: 'false'

      - name: Tooling tests
        run: npm run test:tooling
