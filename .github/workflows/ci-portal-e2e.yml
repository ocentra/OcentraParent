name: CI Portal E2E

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal-e2e:
    name: 'Test: Portal To Rust E2E (${{ matrix.os }})'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Install Playwright Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        run: npx playwright install-deps chromium

      - name: Run real portal-to-Rust E2E
        id: portal_e2e
        continue-on-error: true
        run: npm run test:e2e

      - name: Report portal proof failure
        if: ${{ steps.portal_e2e.outcome == 'failure' }}
        run: |
          node scripts/enforcer/run-ocentra-enforcer.mjs proof last-failure --json
          node scripts/enforcer/run-ocentra-enforcer.mjs proof artifact --proof ocentra-parent.portal-local-smoke --artifact raw/stdout.log

      - name: Enforce portal E2E result
        if: ${{ steps.portal_e2e.outcome == 'failure' }}
        run: node -e "process.exit(1)"
