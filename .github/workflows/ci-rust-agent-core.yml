name: CI Rust Agent Core

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-agent-core:
    name: Rust Agent Core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci

      - name: Rust format
        run: cargo fmt --all --check

      - name: Core clippy
        run: cargo clippy -p ocentra-parent-agent-core --all-targets -- -D warnings

      - name: Core tests
        run: cargo test -p ocentra-parent-agent-core --all-targets
