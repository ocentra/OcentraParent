name: CI Rust Agent Core

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-format:
    name: 'Format: Rust Workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci
        with:
          install-tauri-system-dependencies: 'false'

      - name: Rust format
        run: node scripts/ci/check-rust-format.mjs

  core-clippy:
    name: 'Lint: Rust Agent Core Clippy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [rust-format]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci
        with:
          install-tauri-system-dependencies: 'false'

      - name: Core clippy
        run: cargo clippy -p ocentra-parent-agent-core --all-targets -- -D warnings

  core-tests:
    name: 'Unit: Rust Agent Core Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [core-clippy]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci
        with:
          install-tauri-system-dependencies: 'false'

      - name: Core tests
        run: cargo test -p ocentra-parent-agent-core --all-targets
