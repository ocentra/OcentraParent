name: Production Release

on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      publish:
        description: Publish release artifacts when the version tag is missing. Manual runs default to validation/package rehearsal only.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ocentra-parent-production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fail-fast:
    uses: ./.github/workflows/fail-fast.yml

  secret-scan:
    needs: [fail-fast]
    uses: ./.github/workflows/secret-scan.yml

  validate:
    needs: [secret-scan]
    uses: ./.github/workflows/validate.yml

  build:
    needs: [validate]
    uses: ./.github/workflows/build.yml

  dependency-policy:
    needs: [validate]
    uses: ./.github/workflows/dependency-policy.yml

  package-preview:
    needs: [build, dependency-policy]
    uses: ./.github/workflows/package-preview.yml

  release-decision:
    needs: [package-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish-allowed: ${{ steps.publish.outputs.publish_allowed }}
      release-required: ${{ steps.decision.outputs.release_required }}
      version: ${{ steps.decision.outputs.version }}
      tag: ${{ steps.decision.outputs.tag }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci

      - name: Decide whether this run may publish
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/production" ]]; then
            publish_allowed=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish }}" == "true" ]]; then
            publish_allowed=true
          else
            publish_allowed=false
          fi
          echo "publish_allowed=$publish_allowed" >> "$GITHUB_OUTPUT"
          echo "production-publish-allowed=$publish_allowed"

      - name: Decide whether production should publish
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/decide-production-release.mjs

  release-windows:
    if: needs.release-decision.outputs.release-required == 'true' && needs.release-decision.outputs.publish-allowed == 'true'
    needs: [release-decision]
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci

      - name: Setup .NET for WiX
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check production release secrets
        shell: pwsh
        env:
          OCENTRA_PARENT_UPDATE_SIGNING_KEY_BASE64: ${{ secrets.OCENTRA_PARENT_UPDATE_SIGNING_KEY_BASE64 }}
        run: node scripts/release/check-production-secrets.mjs --release windows

      - name: Build signed Windows MSI package
        shell: pwsh
        env:
          OCENTRA_PARENT_UPDATE_SIGNING_KEY_BASE64: ${{ secrets.OCENTRA_PARENT_UPDATE_SIGNING_KEY_BASE64 }}
        run: ./scripts/release/windows/build-agent-package.ps1

      - name: Smoke signed Windows MSI install and uninstall
        shell: pwsh
        run: ./scripts/smoke/windows-msi-smoke.ps1 -MsiPath ./target/release-packages/ocentra-parent-agent-windows-x64-latest.msi

      - name: Upload signed Windows MSI smoke logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ocentra-parent-signed-windows-msi-smoke-logs
          path: target/release-packages/smoke/*.log

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release/windows/create-github-release.ps1
