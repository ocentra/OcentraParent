name: Package Preview

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msi:
    name: Windows MSI Preview
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci

      - name: Setup .NET for WiX
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build preview Windows MSI
        shell: pwsh
        env:
          OCENTRA_PARENT_ALLOW_EPHEMERAL_UPDATE_KEY: 'true'
        run: ./scripts/release/windows/build-agent-package.ps1

      - name: Smoke Windows MSI install and uninstall
        shell: pwsh
        run: ./scripts/smoke/windows-msi-smoke.ps1 -MsiPath ./target/release-packages/ocentra-parent-agent-windows-x64-latest.msi

      - name: Upload Windows MSI smoke logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ocentra-parent-windows-msi-smoke-logs
          path: target/release-packages/smoke/*.log

      - name: Upload Windows MSI preview
        uses: actions/upload-artifact@v6
        with:
          name: ocentra-parent-windows-x64-preview
          path: |
            target/release-packages/*.msi
            target/release-packages/*.sha256
            target/release-packages/latest-windows.json
            target/release-packages/install-ocentra-parent-agent-windows.ps1

  linux-deb:
    name: Linux DEB Preview
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci

      - name: Record Linux package baseline
        run: |
          . /etc/os-release
          echo "package-baseline=$PRETTY_NAME"
          getconf GNU_LIBC_VERSION

      - name: Build Linux DEB package
        run: bash scripts/release/linux/build-agent-package.sh

      - name: Smoke Linux DEB install and remove
        run: bash scripts/smoke/linux-deb-smoke.sh target/release-packages/linux/ocentra-parent-agent-linux-amd64-latest.deb

      - name: Upload Linux package preview
        uses: actions/upload-artifact@v6
        with:
          name: ocentra-parent-linux-amd64-preview
          path: |
            target/release-packages/linux/*.deb
            target/release-packages/linux/*.sha256
            target/release-packages/linux/linux-baseline.json
            test-results/linux-package-smoke/*

  macos-pkg:
    name: macOS PKG Preview
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci

      - name: Build macOS PKG package
        run: bash scripts/release/macos/build-agent-package.sh

      - name: Smoke macOS PKG payload
        run: bash scripts/smoke/macos-pkg-smoke.sh target/release-packages/macos/ocentra-parent-agent-macos-latest.pkg

      - name: Upload macOS package preview
        uses: actions/upload-artifact@v6
        with:
          name: ocentra-parent-macos-preview
          path: |
            target/release-packages/macos/*.pkg
            target/release-packages/macos/*.sha256

  android-apk:
    name: Android APK Preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build Android APK
        run: node scripts/release/android/build-agent-package.mjs

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke Android APK in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          emulator-boot-timeout: 900
          script: bash scripts/smoke/android-apk-smoke.sh target/release-packages/android/ocentra-parent-agent-android-debug-latest.apk

      - name: Upload Android package preview
        uses: actions/upload-artifact@v6
        with:
          name: ocentra-parent-android-preview
          path: |
            target/release-packages/android/*.apk
            target/release-packages/android/*.sha256

  ios-simulator:
    name: iOS Simulator App Preview
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci

      - name: Build iOS simulator app
        run: bash scripts/release/ios/build-simulator-app.sh

      - name: Smoke iOS simulator app install and launch
        run: bash scripts/smoke/ios-simulator-smoke.sh target/ios-derived-data/Build/Products/Debug-iphonesimulator/OcentraParentAgent.app

      - name: Write tracking iOS simulator proof
        run: npm run test:tracking-plan-ios-simulator-proof -- --require-simulator --skip-build --app-path target/ios-derived-data/Build/Products/Debug-iphonesimulator/OcentraParentAgent.app

      - name: Upload iOS simulator preview
        uses: actions/upload-artifact@v6
        with:
          name: ocentra-parent-ios-simulator-preview
          path: |
            target/release-packages/ios/*.zip
            target/release-packages/ios/*.sha256
            test-results/tracking-plan-ios-simulator-proof/**
            output/tracking-plan-proof/11-ios-core-location-foreground-adapter/18-ios-simulator-proof.json
            output/tracking-plan-proof/12-ios-background-region-significant-change-adapter/18-ios-simulator-proof.json
            output/tracking-plan-proof/31-platform-extension-checklists-and-proof-routing/18-ios-simulator-proof.json
