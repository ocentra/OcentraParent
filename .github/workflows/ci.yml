name: CI Gate

on:
  pull_request:
    branches:
      - main
      - production
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ocentra-parent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fail-fast:
    uses: ./.github/workflows/fail-fast.yml

  secret-scan:
    needs: [fail-fast]
    uses: ./.github/workflows/secret-scan.yml

  validate:
    needs: [secret-scan]
    uses: ./.github/workflows/validate.yml

  build:
    needs: [secret-scan]
    uses: ./.github/workflows/build.yml

  dependency-policy:
    needs: [secret-scan]
    uses: ./.github/workflows/dependency-policy.yml

  package-preview:
    needs: [validate, build, dependency-policy]
    uses: ./.github/workflows/package-preview.yml
