name: Setup Ocentra Parent CI
description: Install shared CI runtime dependencies for Ocentra Parent workflows.

inputs:
  install-mode:
    description: Use "ci" to run npm ci or "skip" to only configure runtimes.
    required: false
    default: ci
  install-rust:
    description: Install the Rust toolchain pinned by rust-toolchain.toml.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm

    - name: Checkout pinned Ocentra Enforcer private Rust test allowlist repair
      shell: bash
      env:
        OCENTRA_ENFORCER_HOME: ${{ runner.temp }}/ocentra-enforcer
        OCENTRA_ENFORCER_COMMIT: 9d21780f9a4f5a498fb16a6b1ae1c05ac2d83e36
      run: |
        rm -rf "$OCENTRA_ENFORCER_HOME"
        git init "$OCENTRA_ENFORCER_HOME"
        git -C "$OCENTRA_ENFORCER_HOME" remote add origin https://github.com/ocentra/ocentra-enforcer.git
        git -C "$OCENTRA_ENFORCER_HOME" fetch --depth 1 origin "$OCENTRA_ENFORCER_COMMIT"
        git -C "$OCENTRA_ENFORCER_HOME" checkout --detach FETCH_HEAD
        resolved_enforcer_commit="$(git -C "$OCENTRA_ENFORCER_HOME" rev-parse HEAD)"
        test "$resolved_enforcer_commit" = "$OCENTRA_ENFORCER_COMMIT"
        npm ci --prefix "$OCENTRA_ENFORCER_HOME"
        test -f "$OCENTRA_ENFORCER_HOME/scripts/rust-rules.mjs"
        printf 'Ocentra Enforcer pinned commit resolved to %s\n' "$resolved_enforcer_commit"
        printf 'OCENTRA_ENFORCER_HOME=%s\n' "$OCENTRA_ENFORCER_HOME" >> "$GITHUB_ENV"

    - name: Setup Rust
      if: inputs.install-rust == 'true'
      shell: bash
      run: |
        rust_channel="$(node -e "const fs=require('node:fs'); const text=fs.readFileSync('rust-toolchain.toml','utf8'); const match=text.match(/channel\\s*=\\s*['\\\"]([^'\\\"]+)['\\\"]/); if (!match) process.exit(1); process.stdout.write(match[1]);")"
        rustup toolchain install "$rust_channel" --profile minimal --component clippy --component rustfmt --no-self-update
        rustup default "$rust_channel"

    - name: Install Linux Tauri system dependencies
      if: runner.os == 'Linux' && inputs.install-rust == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --yes \
          build-essential \
          curl \
          file \
          libayatana-appindicator3-dev \
          libclang-dev \
          libdbus-1-dev \
          libegl-dev \
          libpipewire-0.3-dev \
          librsvg2-dev \
          libssl-dev \
          libwebkit2gtk-4.1-dev \
          libwayland-dev \
          libxcb1-dev \
          libxdo-dev \
          libxrandr-dev \
          pkg-config \
          wget \
          imagemagick \
          x11-apps

    - name: Install npm dependencies
      if: inputs.install-mode != 'skip'
      shell: bash
      run: npm ci
